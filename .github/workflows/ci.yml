name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The reusable workflows are in the nomux-sh/.github repository.
  # They are referenced by branch: they are first-party and change together
  # with the repositories that call them.
  buf:
    uses: nomux-sh/.github/.github/workflows/buf-ci.yml@main
    with:
      working-directory: .
      # Empty: the breaking change check does not run. No tag exists yet.
      # After the first tag, set this to the last tag, for example
      # ".git#tag=v0.1.0".
      breaking-against: ""

  rust:
    uses: nomux-sh/.github/.github/workflows/rust-ci.yml@main
    with:
      # Linux only. The crate has no platform-specific code.
      os: '["ubuntu-latest"]'
      working-directory: .
      run-deny: true
      run-machete: true

  dco:
    if: github.event_name == 'pull_request'
    uses: nomux-sh/.github/.github/workflows/dco.yml@main

  commitlint:
    if: github.event_name == 'pull_request'
    uses: nomux-sh/.github/.github/workflows/commitlint.yml@main

  # Fails if crates/nomux-proto/src/generated is not the output of
  # `buf generate` for the committed schemas.
  generated:
    name: generated code is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUF_VERSION: 1.75.0
      BUF_SHA256: fad1e38d6909bbb583a4da81d8c02a01046e2cd663bde7e337dd24277393764b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install buf
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/buf" \
            "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64"
          echo "${BUF_SHA256}  $RUNNER_TEMP/bin/buf" | sha256sum --check -
          chmod +x "$RUNNER_TEMP/bin/buf"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # rustup reads rust-toolchain.toml and installs the pinned toolchain
      # when cargo starts.
      - name: Check generated code
        run: scripts/check-generated.sh
