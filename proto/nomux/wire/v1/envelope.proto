// The envelope of the nomux control protocol.
//
// Each message on the control channel is one `Envelope`. An envelope contains
// a request, a response, or an event:
//
// - The client sends a `Request` with an `id`.
// - The daemon sends one `Response` with the same `id`.
// - The daemon also sends `Event` messages that no request asked for.
//
// STATUS: DRAFT. The messages can change in a minor version until version
// 1.0.0.
//
// Field number plan for the `body` and `result` oneofs. Field numbers are
// permanent, thus each service has its own block:
//
//   1 to 15      Envelope fields (id, error). These numbers use one tag byte.
//   16 to 99     Not assigned.
//   100 to 199   Handshake service.
//   200 to 299   Host service.
//   300 to 399   Session service.
//   400 to 499   Ext service.
//   500 to 599   Agent service.
//   600 to 699   Events service.
//   700 to 799   Hooks service.
//   800 to 899   Workspace service.
//   900 to 999   Worktree service.
//   1000 and up  Not assigned. Each new service takes the next free block of
//                100 numbers.
//
// A request and its response use the same field number where possible. An
// event body in `Event.body` uses a number of the block of its service.
// The plan is a comment and not a `reserved` statement: `buf breaking` does
// not let you delete a reserved range, and each block must stay available to
// its service.

syntax = "proto3";

package nomux.wire.v1;

import "nomux/wire/v1/agent.proto";
import "nomux/wire/v1/events.proto";
import "nomux/wire/v1/ext.proto";
import "nomux/wire/v1/handshake.proto";
import "nomux/wire/v1/hooks.proto";
import "nomux/wire/v1/host.proto";
import "nomux/wire/v1/session.proto";
import "nomux/wire/v1/workspace.proto";
import "nomux/wire/v1/worktree.proto";

// The reason for a failed request.
//
// Each value is equal to the related exit code of the `nomux` command-line
// client.
enum ErrorCode {
  // The daemon did not set the field. The client treats this as an error.
  ERROR_CODE_UNSPECIFIED = 0;
  // The request failed, and no other code gives the reason.
  ERROR_CODE_FAILED = 1;
  // The item that the request names does not exist.
  ERROR_CODE_NOT_FOUND = 2;
  // The daemon did not complete the request in the permitted time.
  ERROR_CODE_TIMEOUT = 3;
  // The client does not have permission. For the handshake: the token is
  // missing, not valid, or revoked.
  ERROR_CODE_PERMISSION_DENIED = 4;
  // The client and the daemon have no common control protocol version.
  // See spec/compatibility.md.
  ERROR_CODE_VERSION_INCOMPATIBLE = 5;
}

// The failure result of a request.
message Error {
  // The reason for the failure.
  ErrorCode code = 1;
  // A message in English for the user. The text is not stable: clients must
  // not parse it.
  string message = 2;
}

// A numbered request from the client to the daemon.
message Request {
  // The request number. The client selects the value. The value is not 0 and
  // is different from the `id` of each request that has no response yet on
  // the same connection.
  uint64 id = 1;
  // The request body. Each new service adds its requests here. See the field
  // number plan at the top of this file.
  oneof body {
    // Handshake: the first request on a connection.
    Hello hello = 100;
    // Host.Info.
    HostInfoRequest host_info = 200;
    // Host.Stop.
    HostStopRequest host_stop = 201;
    // Session.Create.
    SessionCreateRequest session_create = 300;
    // Session.List.
    SessionListRequest session_list = 301;
    // Session.Kill.
    SessionKillRequest session_kill = 302;
    // Session.Attach. It is the last request on its connection.
    SessionAttachRequest session_attach = 303;
    // Session.Detach.
    SessionDetachRequest session_detach = 304;
    // Session.Input.
    SessionInputRequest session_input = 305;
    // Session.Resize.
    SessionResizeRequest session_resize = 306;
    // Session.Start.
    SessionStartRequest session_start = 307;
    // Session.Capture.
    SessionCaptureRequest session_capture = 308;
    // Session.SetRestorePolicy.
    SessionSetRestorePolicyRequest session_set_restore_policy = 309;
    // Session.Memory.
    SessionMemoryRequest session_memory = 310;
    // Session.Hibernate.
    SessionHibernateRequest session_hibernate = 311;
    // Session.SetPinned.
    SessionSetPinnedRequest session_set_pinned = 312;
    // Session.Rename.
    SessionRenameRequest session_rename = 313;
    // Ext.List.
    ExtListRequest ext_list = 400;
    // Ext.Inspect.
    ExtInspectRequest ext_inspect = 401;
    // Ext.Install.
    ExtInstallRequest ext_install = 402;
    // Ext.Remove.
    ExtRemoveRequest ext_remove = 403;
    // Ext.SetEnabled.
    ExtSetEnabledRequest ext_set_enabled = 404;
    // Ext.Call.
    ExtCallRequest ext_call = 405;
    // Agent.Tree.
    AgentTreeRequest agent_tree = 500;
    // Agent.Explain.
    AgentExplainRequest agent_explain = 501;
    // Agent.SetStatus.
    AgentSetStatusRequest agent_set_status = 502;
    // Events.Subscribe. It is the last request on its connection.
    EventsSubscribeRequest events_subscribe = 600;
    // Hooks.Event.
    HookEventRequest hook_event = 700;
    // Hooks.Plan.
    HooksPlanRequest hooks_plan = 701;
    // Hooks.Adapters.
    HooksAdaptersRequest hooks_adapters = 702;
    // Workspace.Tree.
    WorkspaceTreeRequest workspace_tree = 800;
    // Workspace.AddProject.
    WorkspaceAddProjectRequest workspace_add_project = 801;
    // Workspace.RemoveProject.
    WorkspaceRemoveProjectRequest workspace_remove_project = 802;
    // Workspace.CreateGroup.
    WorkspaceCreateGroupRequest workspace_create_group = 803;
    // Workspace.RemoveGroup.
    WorkspaceRemoveGroupRequest workspace_remove_group = 804;
    // Workspace.Rename.
    WorkspaceRenameRequest workspace_rename = 805;
    // Workspace.Move.
    WorkspaceMoveRequest workspace_move = 806;
    // Worktree.List.
    WorktreeListRequest worktree_list = 900;
    // Worktree.Plan.
    WorktreePlanRequest worktree_plan = 901;
    // Worktree.Clean.
    WorktreeCleanRequest worktree_clean = 902;
    // Worktree.Mark.
    WorktreeMarkRequest worktree_mark = 903;
    // Worktree.Trash.
    WorktreeTrashRequest worktree_trash = 904;
    // Worktree.Restore.
    WorktreeRestoreRequest worktree_restore = 905;
    // Worktree.EmptyTrash.
    WorktreeEmptyTrashRequest worktree_empty_trash = 906;
  }
}

// The response from the daemon to one request.
message Response {
  // The `id` of the request that this response answers.
  uint64 id = 1;
  // The result of the request. Each new service adds its results here. See
  // the field number plan at the top of this file.
  oneof result {
    // The request failed.
    Error error = 2;
    // Handshake: the reply to `Hello`.
    Welcome welcome = 100;
    // Host.Info.
    HostInfoResponse host_info = 200;
    // Host.Stop.
    HostStopResponse host_stop = 201;
    // Session.Create.
    SessionCreateResponse session_create = 300;
    // Session.List.
    SessionListResponse session_list = 301;
    // Session.Kill.
    SessionKillResponse session_kill = 302;
    // Session.Attach. After this response, the connection carries terminal
    // frames.
    SessionAttachResponse session_attach = 303;
    // Session.Detach.
    SessionDetachResponse session_detach = 304;
    // Session.Input.
    SessionInputResponse session_input = 305;
    // Session.Resize.
    SessionResizeResponse session_resize = 306;
    // Session.Start.
    SessionStartResponse session_start = 307;
    // Session.Capture.
    SessionCaptureResponse session_capture = 308;
    // Session.SetRestorePolicy.
    SessionSetRestorePolicyResponse session_set_restore_policy = 309;
    // Session.Memory.
    SessionMemoryResponse session_memory = 310;
    // Session.Hibernate.
    SessionHibernateResponse session_hibernate = 311;
    // Session.SetPinned.
    SessionSetPinnedResponse session_set_pinned = 312;
    // Session.Rename.
    SessionRenameResponse session_rename = 313;
    // Ext.List.
    ExtListResponse ext_list = 400;
    // Ext.Inspect.
    ExtInspectResponse ext_inspect = 401;
    // Ext.Install.
    ExtInstallResponse ext_install = 402;
    // Ext.Remove.
    ExtRemoveResponse ext_remove = 403;
    // Ext.SetEnabled.
    ExtSetEnabledResponse ext_set_enabled = 404;
    // Ext.Call. The extension answered: with a result or with an error.
    ExtCallResponse ext_call = 405;
    // Agent.Tree.
    AgentTreeResponse agent_tree = 500;
    // Agent.Explain.
    AgentExplainResponse agent_explain = 501;
    // Agent.SetStatus.
    AgentSetStatusResponse agent_set_status = 502;
    // Events.Subscribe. After this response, the connection carries only
    // events.
    EventsSubscribeResponse events_subscribe = 600;
    // Hooks.Event.
    HookEventResponse hook_event = 700;
    // Hooks.Plan.
    HooksPlanResponse hooks_plan = 701;
    // Hooks.Adapters.
    HooksAdaptersResponse hooks_adapters = 702;
    // Workspace.Tree.
    WorkspaceTreeResponse workspace_tree = 800;
    // Workspace.AddProject.
    WorkspaceAddProjectResponse workspace_add_project = 801;
    // Workspace.RemoveProject.
    WorkspaceRemoveProjectResponse workspace_remove_project = 802;
    // Workspace.CreateGroup.
    WorkspaceCreateGroupResponse workspace_create_group = 803;
    // Workspace.RemoveGroup.
    WorkspaceRemoveGroupResponse workspace_remove_group = 804;
    // Workspace.Rename.
    WorkspaceRenameResponse workspace_rename = 805;
    // Workspace.Move.
    WorkspaceMoveResponse workspace_move = 806;
    // Worktree.List.
    WorktreeListResponse worktree_list = 900;
    // Worktree.Plan.
    WorktreePlanResponse worktree_plan = 901;
    // Worktree.Clean.
    WorktreeCleanResponse worktree_clean = 902;
    // Worktree.Mark.
    WorktreeMarkResponse worktree_mark = 903;
    // Worktree.Trash.
    WorktreeTrashResponse worktree_trash = 904;
    // Worktree.Restore.
    WorktreeRestoreResponse worktree_restore = 905;
    // Worktree.EmptyTrash.
    WorktreeEmptyTrashResponse worktree_empty_trash = 906;
  }
}

// A message from the daemon that no request asked for. The daemon sends
// events only on a connection that asked for them with `Events.Subscribe`.
message Event {
  // The position of the event in the event log of the host. The value
  // increases with each event. A client can resume from the last value that
  // it received.
  uint64 seq = 1;
  // When the event occurred: milliseconds after the Unix epoch.
  uint64 at_ms = 2;
  // What occurred. A client ignores an event whose body it does not know.
  // Each service adds its events here, with numbers of its block of the
  // field number plan at the top of this file.
  oneof body {
    // Session: the daemon hibernated a Session.
    SessionHibernated session_hibernated = 300;
    // Session: a wake started the resume command of a Session.
    SessionWoken session_woken = 301;
    // Session: a wake of a Session failed.
    SessionWakeFailed session_wake_failed = 302;
    // Session: the operating system ended a Session at its memory limit.
    SessionMemoryLimitReached session_memory_limit_reached = 303;
    // Ext: an extension sent an event.
    ExtensionEvent extension_event = 400;
    // Agent: the status of a Session changed.
    AgentRunChanged agent_run_changed = 500;
    // Agent: a Session has no status any more.
    AgentRunRemoved agent_run_removed = 501;
    // Events: the daemon does not have the events that the client asked
    // for. The state of the Host now follows.
    EventsSnapshot snapshot = 600;
    // Workspace: the workspace tree changed.
    WorkspaceChanged workspace_changed = 800;
    // Worktree: a clean, a restore, the end of a grace time or a mark
    // changed a Worktree.
    WorktreeChanged worktree_changed = 900;
    // Worktree: the free space of a file system with Worktrees went to a
    // different level.
    WorktreeDiskPressure worktree_disk_pressure = 901;
  }
}

// One message on the control channel.
message Envelope {
  // The content of the envelope.
  oneof kind {
    // A request from the client.
    Request request = 1;
    // A response from the daemon.
    Response response = 2;
    // An event from the daemon.
    Event event = 3;
  }
}
