// Host service of the nomux control protocol.
//
// The requests and the responses are fields of `Request.body` and
// `Response.result` (see envelope.proto). The Host service has the field
// numbers 200 to 299 there.
//
// STATUS: DRAFT. The messages can change in a minor version until version
// 1.0.0.

syntax = "proto3";

package nomux.wire.v1;

// Host.Info: asks for the state of the daemon.
message HostInfoRequest {}

// The reply to `HostInfoRequest`.
message HostInfoResponse {
  // The product version of the daemon, for example "0.1.0".
  string daemon_version = 1;
  // The process ID of the daemon on the Host.
  uint32 daemon_pid = 2;
  // The number of Sessions that the daemon knows.
  uint32 session_count = 3;
  // If the operating system applies a memory limit to a Session. Absent
  // from a daemon that is older than the field.
  MemoryLimitSupport memory_limit = 4;
  // What the operating system of the Host applies of a sandbox. Absent
  // from a daemon without the capability `session_sandbox`.
  SandboxSupport sandbox = 5;
}

// What the operating system of the Host applies of a sandbox profile.
message SandboxSupport {
  // The features that the operating system can apply. Each item is a
  // feature name of spec/control.md, "Sandbox". Empty if the Host can
  // apply no sandbox: a Session with a profile other than `off` does not
  // start there.
  repeated string enforced = 1;
  // The features that the operating system cannot apply.
  repeated string missing = 2;
  // What the daemon found, in English for the user: for example the
  // kernel and the version of its interface for the sandbox.
  string detail = 3;
}

// What the daemon can do with a memory limit of a Session.
message MemoryLimitSupport {
  // True if the operating system ends the processes of a Session at its
  // memory limit. False if the limit is only a threshold for hibernation.
  bool applied = 1;
  // How the limit is applied, or why the operating system applies none, in
  // English for the user.
  string detail = 2;
}

// Host.Stop: tells the daemon to stop. No Session ends: the holders
// continue, and the next daemon finds them.
message HostStopRequest {}

// The reply to `HostStopRequest`. The daemon sends it and then closes each
// connection and exits.
message HostStopResponse {}
