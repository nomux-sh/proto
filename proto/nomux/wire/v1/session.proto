// Session service of the nomux control protocol.
//
// The requests and the responses are fields of `Request.body` and
// `Response.result` (see envelope.proto). The Session service has the field
// numbers 300 to 399 there.
//
// STATUS: DRAFT. The messages can change in a minor version until version
// 1.0.0.

syntax = "proto3";

package nomux.wire.v1;

// The state of a Session, as the daemon knows it.
enum SessionState {
  // The daemon did not set the field. The client treats the state as unknown.
  SESSION_STATE_UNSPECIFIED = 0;
  // The command of the Session runs.
  SESSION_STATE_RUNNING = 1;
  // The holder of the Session runs, but the daemon has no connection to it.
  // The daemon tries to connect again.
  SESSION_STATE_UNREACHABLE = 2;
}

// One Session on the Host.
message Session {
  // The session identifier: 1 to 64 characters from `A-Z`, `a-z`, `0-9`, `-`
  // and `_`. The value is unique on the Host.
  string id = 1;
  // The state of the Session.
  SessionState state = 2;
  // The process ID of the command on the Host. The value is 0 if the daemon
  // does not know it.
  uint32 pid = 3;
}

// Session.Create: starts a new Session.
message SessionCreateRequest {
  // The program and its arguments. If the list is empty, the daemon starts
  // the shell of the user.
  repeated string command = 1;
  // The working directory of the command: an absolute path on the Host. If
  // the value is empty, the daemon uses the home directory of the user.
  string working_directory = 2;
}

// The reply to `SessionCreateRequest`.
message SessionCreateResponse {
  // The new Session.
  Session session = 1;
}

// Session.List: asks for all Sessions on the Host.
message SessionListRequest {}

// The reply to `SessionListRequest`.
message SessionListResponse {
  // The Sessions, in the sequence of their identifiers.
  repeated Session sessions = 1;
}

// Session.Kill: ends a Session. The daemon answers after the command of the
// Session has ended.
message SessionKillRequest {
  // The identifier of the Session.
  string id = 1;
}

// The reply to `SessionKillRequest`.
message SessionKillResponse {}

// Session.Attach: connects the client to the terminal of a Session.
//
// After the response, the connection carries terminal frames and no control
// messages: spec/frame.md has the terminal data path. A client ends its
// attach when it closes the connection.
message SessionAttachRequest {
  // The identifier of the Session.
  string id = 1;
  // The number of rows of the window of the client. If `rows` and `columns`
  // are not 0, the Session gets this window size before the daemon sends the
  // screen. If the two values are 0, the window size does not change.
  uint32 rows = 2;
  // The number of columns of the window of the client.
  uint32 columns = 3;
  // The epoch of the output that the client already has. The value is 0 if
  // the client has no output of the Session.
  uint32 epoch = 4;
  // The sequence number of the first output byte that the client does not
  // have. The daemon reads the value only if `epoch` is not 0.
  uint64 from_seq = 5;
}

// The reply to `SessionAttachRequest`. It is the last control message on the
// connection.
message SessionAttachResponse {
  // The session handle: the value of the `session` field of each terminal
  // frame of this attach. The value is not 0.
  uint32 handle = 1;
  // The current epoch of the Session. The value is not 0.
  uint32 epoch = 2;
}

// Session.Detach: ends each attach to a Session. The Session continues.
message SessionDetachRequest {
  // The identifier of the Session.
  string id = 1;
}

// The reply to `SessionDetachRequest`.
message SessionDetachResponse {
  // The number of clients that the daemon detached.
  uint32 detached = 1;
}

// Session.Input: writes bytes to the terminal of a Session, as if the user
// typed them. A client that is attached sends `Input` frames instead.
message SessionInputRequest {
  // The identifier of the Session.
  string id = 1;
  // The bytes for the terminal.
  bytes data = 2;
}

// The reply to `SessionInputRequest`.
message SessionInputResponse {}

// Session.Resize: changes the window size of a Session.
message SessionResizeRequest {
  // The identifier of the Session.
  string id = 1;
  // The number of rows: 1 to 65535.
  uint32 rows = 2;
  // The number of columns: 1 to 65535. A window has 1048576 cells at most.
  uint32 columns = 3;
}

// The reply to `SessionResizeRequest`.
message SessionResizeResponse {}
