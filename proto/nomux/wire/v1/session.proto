// Session service of the nomux control protocol.
//
// The requests and the responses are fields of `Request.body` and
// `Response.result` (see envelope.proto). The Session service has the field
// numbers 300 to 399 there.
//
// STATUS: DRAFT. The messages can change in a minor version until version
// 1.0.0.

syntax = "proto3";

package nomux.wire.v1;

// The state of a Session, as the daemon knows it.
enum SessionState {
  // The daemon did not set the field. The client treats the state as unknown.
  SESSION_STATE_UNSPECIFIED = 0;
  // The command of the Session runs.
  SESSION_STATE_RUNNING = 1;
  // The holder of the Session runs, but the daemon has no connection to it.
  // The daemon tries to connect again.
  SESSION_STATE_UNREACHABLE = 2;
  // The Session has no process: its holder is gone, and its command did not
  // end. The daemon has the description of the Session and its output. A
  // restore starts the command again in a new epoch.
  SESSION_STATE_DORMANT = 3;
  // The command of the Session ended. The daemon keeps the Session and its
  // output for a retention time.
  SESSION_STATE_ENDED = 4;
  // The daemon cannot read the description of the Session. `Session.damage`
  // has the reason. The Session cannot start again.
  SESSION_STATE_DAMAGED = 5;
}

// When the daemon starts the command of a dormant Session again.
enum RestorePolicy {
  // The sender did not set the field.
  RESTORE_POLICY_UNSPECIFIED = 0;
  // When the daemon starts.
  RESTORE_POLICY_AUTO = 1;
  // When a client attaches to the Session for the first time.
  RESTORE_POLICY_ON_FOCUS = 2;
  // Only for a `SessionStartRequest`.
  RESTORE_POLICY_MANUAL = 3;
}

// How and when the command of a Session ended.
message SessionExit {
  // When the command ended: seconds after the Unix epoch.
  uint64 ended_at = 1;
  // How the command ended. The daemon sets no field if it does not know.
  oneof status {
    // The exit code of the command.
    int32 exit_code = 2;
    // The number of the signal that ended the command, as the operating
    // system of the Host gives it.
    int32 signal = 3;
  }
}

// One Session on the Host.
message Session {
  // The session identifier: 1 to 64 characters from `A-Z`, `a-z`, `0-9`, `-`
  // and `_`. The value is unique on the Host.
  string id = 1;
  // The state of the Session.
  SessionState state = 2;
  // The process ID of the command on the Host. The value is 0 if the daemon
  // does not know it or if the Session has no process.
  uint32 pid = 3;
  // The program of the command and its arguments. A byte sequence that is not
  // UTF-8 has U+FFFD in its place. The list is empty if the daemon does not
  // know the command.
  repeated string command = 4;
  // The working directory of the command. A byte sequence that is not UTF-8
  // has U+FFFD in its place. The value is empty if the daemon does not know
  // it.
  string working_directory = 5;
  // The number of rows of the window of the Session. The value is 0 if the
  // daemon does not know it.
  uint32 rows = 6;
  // The number of columns of the window of the Session.
  uint32 columns = 7;
  // When the command started in the current epoch: seconds after the Unix
  // epoch. The value is 0 if the daemon does not know it.
  uint64 started_at = 8;
  // The current epoch of the Session, or its last epoch if the Session has
  // no process. The value is 0 if the daemon does not know it.
  uint32 epoch = 9;
  // When the daemon starts the command again after it became dormant.
  RestorePolicy restore_policy = 10;
  // How the command ended. Only if `state` is `SESSION_STATE_ENDED`.
  SessionExit exit = 11;
  // Why the daemon cannot read a part of the state files of the Session, in
  // English for the user. The value is empty if the files are not damaged.
  string damage = 12;
  // The working directory with each symbolic link resolved: an absolute path
  // on the Host. The daemon resolves `working_directory` one time, when the
  // Session is created or when the daemon finds it again after its start.
  // The value is empty if the daemon cannot resolve the path, for example
  // because the directory was removed, and from a daemon that is older than
  // the field. A client matches the Session with a Project by this value if
  // it is not empty, else by `working_directory`: spec/workspace.md.
  string resolved_working_directory = 13;
  // The hibernation of the Session. Present while the Session is
  // hibernated, and while its command is the resumed run of the last
  // hibernation. Absent if the Session never hibernated, and after a restore
  // that started the command of the Session instead of the resume command.
  // A hibernated Session has the state `SESSION_STATE_DORMANT`:
  // spec/control.md, "Hibernation".
  SessionHibernation hibernation = 14;
  // The user excluded the Session from automatic hibernation.
  bool pinned = 15;
}

// Why the daemon hibernated a Session.
enum HibernationReason {
  // The sender did not set the field. The client treats the reason as
  // unknown.
  HIBERNATION_REASON_UNSPECIFIED = 0;
  // More agents were live than the limit of the configuration.
  HIBERNATION_REASON_COUNT = 1;
  // The processes of the Session used more memory than the limit for one
  // Session, and the operating system applies no limit to the Session.
  HIBERNATION_REASON_SESSION_MEMORY = 2;
  // The processes of all Sessions used more memory than the limit for all
  // Sessions.
  HIBERNATION_REASON_TOTAL_MEMORY = 3;
  // The operating system reported memory pressure on the Host.
  HIBERNATION_REASON_MEMORY_PRESSURE = 4;
  // A client asked for it: `SessionHibernateRequest`.
  HIBERNATION_REASON_REQUEST = 5;
}

// The last hibernation of a Session.
message SessionHibernation {
  // When the daemon stopped the command: seconds after the Unix epoch.
  uint64 hibernated_at = 1;
  // Why the daemon stopped the command.
  HibernationReason reason = 2;
  // The memory of the process tree of the command just before the stop, in
  // bytes: the memory that the hibernation gave back. 0 if the daemon could
  // not measure it.
  uint64 freed_bytes = 3;
  // How the daemon measured `freed_bytes`.
  MemoryMeasure measure = 4;
  // The command that a wake starts, as the adapter reported it in
  // `AgentDetails.resume_command`.
  string resume_command = 5;
  // When a wake started `resume_command`: seconds after the Unix epoch. 0
  // while the Session is hibernated. If it is not 0, the command of the
  // Session is the resumed run.
  uint64 woken_at = 6;
  // Why the last wake failed, in English for the user. Empty if no wake
  // failed since the hibernation.
  string wake_error = 7;
}

// Session.Create: starts a new Session.
message SessionCreateRequest {
  // The program and its arguments. If the list is empty, the daemon starts
  // the shell of the user.
  repeated string command = 1;
  // The working directory of the command: an absolute path on the Host. If
  // the value is empty, the daemon uses the home directory of the user.
  string working_directory = 2;
}

// The reply to `SessionCreateRequest`.
message SessionCreateResponse {
  // The new Session.
  Session session = 1;
}

// Session.List: asks for the Sessions on the Host.
message SessionListRequest {
  // If the value is true, the response also has the Sessions in the state
  // `SESSION_STATE_ENDED`.
  bool include_ended = 1;
}

// The reply to `SessionListRequest`.
message SessionListResponse {
  // The Sessions, in the sequence of their identifiers.
  repeated Session sessions = 1;
}

// Session.Kill: ends a Session. The daemon answers after the command of the
// Session has ended. For a dormant or a damaged Session, the daemon removes
// the Session and its state.
message SessionKillRequest {
  // The identifier of the Session.
  string id = 1;
}

// The reply to `SessionKillRequest`.
message SessionKillResponse {}

// Session.Attach: connects the client to the terminal of a Session.
//
// After the response, the connection carries terminal frames and no control
// messages: spec/frame.md has the terminal data path. A client ends its
// attach when it closes the connection.
//
// An attach to a dormant Session starts its command again, if the restore
// policy of the Session is not `RESTORE_POLICY_MANUAL`.
message SessionAttachRequest {
  // The identifier of the Session.
  string id = 1;
  // The number of rows of the window of the client. If `rows` and `columns`
  // are not 0, the Session gets this window size before the daemon sends the
  // screen. If the two values are 0, the window size does not change.
  uint32 rows = 2;
  // The number of columns of the window of the client.
  uint32 columns = 3;
  // The epoch of the output that the client already has. The value is 0 if
  // the client has no output of the Session.
  uint32 epoch = 4;
  // The sequence number of the first output byte that the client does not
  // have. The daemon reads the value only if `epoch` is not 0.
  uint64 from_seq = 5;
}

// The reply to `SessionAttachRequest`. It is the last control message on the
// connection.
message SessionAttachResponse {
  // The session handle: the value of the `session` field of each terminal
  // frame of this attach. The value is not 0.
  uint32 handle = 1;
  // The current epoch of the Session. The value is not 0.
  uint32 epoch = 2;
}

// Session.Detach: ends each attach to a Session. The Session continues.
message SessionDetachRequest {
  // The identifier of the Session.
  string id = 1;
}

// The reply to `SessionDetachRequest`.
message SessionDetachResponse {
  // The number of clients that the daemon detached.
  uint32 detached = 1;
}

// Session.Input: writes bytes to the terminal of a Session, as if the user
// typed them. A client that is attached sends `Input` frames instead.
message SessionInputRequest {
  // The identifier of the Session.
  string id = 1;
  // The bytes for the terminal.
  bytes data = 2;
}

// The reply to `SessionInputRequest`.
message SessionInputResponse {}

// Session.Resize: changes the window size of a Session.
message SessionResizeRequest {
  // The identifier of the Session.
  string id = 1;
  // The number of rows: 1 to 65535.
  uint32 rows = 2;
  // The number of columns: 1 to 65535. A window has 1048576 cells at most.
  uint32 columns = 3;
}

// The reply to `SessionResizeRequest`.
message SessionResizeResponse {}

// Session.Start: starts the command of a dormant Session again, in a new
// epoch, with the command, the working directory and the window size that
// the Session had. The request succeeds without a change for a Session whose
// command runs.
message SessionStartRequest {
  // The identifier of the Session.
  string id = 1;
}

// The reply to `SessionStartRequest`.
message SessionStartResponse {
  // The Session after the start.
  Session session = 1;
}

// Session.Capture: asks for output bytes of a Session that are before a
// position. A client reads the scrollback with it, one part for each
// request, from the newest output to the oldest. spec/control.md has the
// rules.
message SessionCaptureRequest {
  // The identifier of the Session.
  string id = 1;
  // The epoch of the output. If the value is 0, the daemon uses the newest
  // epoch of the Session.
  uint32 epoch = 2;
  // The sequence number after the last output byte that the client asks
  // for. If the field is absent, it is the end of the output of the epoch.
  optional uint64 before_seq = 3;
  // The largest number of bytes of the response. The daemon gives 262144
  // bytes at most. If the value is 0, the limit is 262144.
  uint32 max_bytes = 4;
}

// The reply to `SessionCaptureRequest`.
message SessionCaptureResponse {
  // The epoch of `data`.
  uint32 epoch = 1;
  // The sequence number of the first byte of `data`. If `data` is empty, it
  // is the position before which the daemon has no output.
  uint64 seq = 2;
  // The output bytes, as the command wrote them. They end at `before_seq`,
  // or earlier if the daemon does not have the bytes up to that position.
  bytes data = 3;
}

// Session.SetRestorePolicy: sets when the daemon starts the command of a
// Session again after the Session became dormant.
message SessionSetRestorePolicyRequest {
  // The identifier of the Session.
  string id = 1;
  // The new policy. `RESTORE_POLICY_UNSPECIFIED` is not valid.
  RestorePolicy policy = 2;
}

// The reply to `SessionSetRestorePolicyRequest`.
message SessionSetRestorePolicyResponse {}

// How the daemon measured the memory of the processes of a Session.
enum MemoryMeasure {
  // The daemon did not set the field. The client treats the measure as
  // unknown.
  MEMORY_MEASURE_UNSPECIFIED = 0;
  // The proportional set size (PSS): the private memory of a process, and
  // of each shared page the part that is equal for each process that uses
  // the page. The sum for more than one process counts no page two times.
  MEMORY_MEASURE_PROPORTIONAL = 1;
  // The resident set size (RSS): each page of a process that is in memory.
  // The sum for more than one process counts a shared page one time for
  // each process that uses it.
  MEMORY_MEASURE_RESIDENT = 2;
}

// The memory that the processes of one Session use.
message SessionMemory {
  // The identifier of the Session.
  string id = 1;
  // The memory of the process tree of the command: the command and each
  // process that descends from it. The value is in bytes. The memory of the
  // holder is not in this value.
  uint64 command_bytes = 2;
  // The number of processes in the process tree of the command.
  uint32 command_processes = 3;
  // The memory of the holder of the Session, in bytes.
  uint64 holder_bytes = 4;
  // How the daemon measured `command_bytes` and `holder_bytes`.
  MemoryMeasure measure = 5;
  // The memory limit that the operating system applies to the processes of
  // the command, in bytes. 0 if no such limit applies.
  uint64 limit_bytes = 6;
}

// Session.Memory: asks for the memory that the processes of each Session
// use. The daemon measures the memory for this request: it keeps no value
// and measures nothing when no client asks. spec/control.md has the rules.
message SessionMemoryRequest {}

// The reply to `SessionMemoryRequest`.
message SessionMemoryResponse {
  // One entry for each Session that has a holder, in the sequence of the
  // identifiers. A Session without a process has no entry.
  repeated SessionMemory sessions = 1;
}

// Session.Hibernate: stops the command of an agent Session that can resume,
// and keeps the Session as a hibernated Session. spec/control.md has the
// conditions.
message SessionHibernateRequest {
  // The identifier of the Session.
  string id = 1;
}

// The reply to `SessionHibernateRequest`. The daemon answers after the
// command of the Session has ended.
message SessionHibernateResponse {
  // The Session after the hibernation.
  Session session = 1;
}

// Session.SetPinned: excludes a Session from automatic hibernation, or
// takes the exclusion back.
message SessionSetPinnedRequest {
  // The identifier of the Session.
  string id = 1;
  // If the value is true, the daemon does not hibernate the Session for a
  // trigger of the configuration.
  bool pinned = 2;
}

// The reply to `SessionSetPinnedRequest`.
message SessionSetPinnedResponse {}

// Event: the daemon hibernated a Session. The fields of the trigger are set
// only for its reason.
message SessionHibernated {
  // The identifier of the Session.
  string session_id = 1;
  // Why the daemon hibernated the Session.
  HibernationReason reason = 2;
  // The memory that the hibernation gave back, as in
  // `SessionHibernation.freed_bytes`.
  uint64 freed_bytes = 3;
  // How the daemon measured `freed_bytes` and `memory_bytes`.
  MemoryMeasure measure = 4;
  // `HIBERNATION_REASON_COUNT`: the number of live agents before the
  // hibernation.
  uint32 live_agents = 5;
  // `HIBERNATION_REASON_COUNT`: the limit of live agents.
  uint32 max_live_agents = 6;
  // `HIBERNATION_REASON_SESSION_MEMORY` and
  // `HIBERNATION_REASON_TOTAL_MEMORY`: the memory that the daemon measured,
  // in bytes: of the Session, or of all Sessions.
  uint64 memory_bytes = 7;
  // `HIBERNATION_REASON_SESSION_MEMORY` and
  // `HIBERNATION_REASON_TOTAL_MEMORY`: the limit, in bytes.
  uint64 memory_limit_bytes = 8;
  // `HIBERNATION_REASON_MEMORY_PRESSURE`: the time in milliseconds that
  // processes waited for memory, in the window below, that made the
  // operating system report the pressure.
  uint32 pressure_stall_ms = 9;
  // `HIBERNATION_REASON_MEMORY_PRESSURE`: the window of the measurement, in
  // milliseconds.
  uint32 pressure_window_ms = 10;
}

// Event: a wake started the resume command of a hibernated Session.
message SessionWoken {
  // The identifier of the Session.
  string session_id = 1;
  // The command that the wake started.
  string resume_command = 2;
}

// Event: a wake of a hibernated Session failed. The Session stays
// hibernated.
message SessionWakeFailed {
  // The identifier of the Session.
  string session_id = 1;
  // Why the wake failed, in English for the user.
  string error = 2;
  // The command that the wake tried to start. The user can run it by hand.
  string resume_command = 3;
}

// Event: the operating system ended the command of a Session, because its
// processes reached the memory limit of the Session.
message SessionMemoryLimitReached {
  // The identifier of the Session.
  string session_id = 1;
  // The memory limit of the Session, in bytes.
  uint64 limit_bytes = 2;
}
